network:
  relay_port: 14141

redis:
  host: sb_redis
  port: 6379

observer:
  # - container_label: for scaled deployments (multiple containers matching the label)
  # - container_name: for fixed single-container observation (fallback)
  container_name: sb_worker
  container_label: com.searchboost.service=worker
  log_path: /logs/worker

breaker:
  breaker_threshold: 5
  breaker_retry_seconds: 20

db:
  host: sb_db
  port: 5432
  user: searchboost
  database: searchboost_db
