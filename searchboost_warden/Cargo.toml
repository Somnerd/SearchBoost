[package]
name = "sb_warden"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures-util = "0.3"

# Networking & Proxy
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-pickle = "1"
redis = { version = "0.24", features = ["tokio-comp", "json"] }

# Docker Observation
bollard = {version = "0.15" , features = ["buildkit","ssl","chrono"]}
anyhow = "1.0"

# Reliability
failsafe = "1.3.0"

# Logging & Observability
tracing = "0.1"
tracing-subscriber = "0.3"
config = { version = "0.15.19", features = ["yaml"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
tower_governor = "0.4.2"
governor = "0.6.3"
